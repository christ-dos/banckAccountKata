
services:
  bank-account-api:
    image: bank-account-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-account-api
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=UTC
    restart: unless-stopped
    # Health check: verify the application is running
    # Note: For production, Spring Boot Actuator should be added
    # Here we simply check if the root endpoint responds
    healthcheck:
      test: ["CMD", "wget","--quiet","--tries=1","--spider","http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


