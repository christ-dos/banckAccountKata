stages:
  - build
  - test
  - quality
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  MIN_COVERAGE: "80"
cache:
  paths:
    - .m2/repository
    - target/

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS clean compile
  artifacts:
    paths:
      - target/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS test
    - mvn $MAVEN_CLI_OPTS jacoco:report
    - echo "✅ Tests terminés, vérification de la couverture minimale de ${MIN_COVERAGE}%"
  dependencies:
    - build
  artifacts:
    when: always
    reports:
        junit: target/surefire-reports/TEST-*.xml
        coverage_report:
          coverage_format: jacoco
          path: target/site/jacoco/jacoco.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

quality:
  stage: quality
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS verify -DskipTests
    - echo "✅ Vérifications de qualité Maven terminées"
  dependencies:
    - test
  artifacts:
    when: always
    paths:
      - target/site/
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - docker build -t bank-account-api:$CI_COMMIT_SHORT_SHA .
    - docker tag bank-account-api:$CI_COMMIT_SHORT_SHA bank-account-api:latest
    - echo "✅ Image Docker créée bank-account-api:$CI_COMMIT_SHORT_SHA"
  dependencies:
    - build
    - test
    - quality
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: on_success
