# Configuration pour les tests
spring:
  application:
    name: bank-account-test

  # Base de données H2 en mémoire pour les tests
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bank: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
