spring:
  application:
    name: bank-account-api

  # Configuration H2 pour le développement
  datasource:
    url: jdbc:h2:mem:bankdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Important : Permet à Hibernate de créer les tables AVANT d'exécuter data.sql
    defer-datasource-initialization: true

  # Initialisation des données de test au démarrage
  sql:
    init:
      mode: always

server:
  port: 9090

# Business configuration
bank:
  account:
    savings:
      default-deposit-limit: 22950  # Livret A standard limit in EUR

loging:
  level:
    com.bank: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
